name: Runtime checks
on:
  push:
    branches: [main, fix/runtime-correctness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check executor communication protocol
        run: python3 -m unittest discover -s coordination/tests -p 'test_*.py' -v
      - run: node dist-server/server/seed/selfcheck.js
      - name: Save verified production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7
